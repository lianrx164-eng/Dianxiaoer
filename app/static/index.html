<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小喵 · 智能客服 | 喵喵优选</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    padding: 32px 16px;
    display: grid;
    place-items: center;
    background-color: #f4dfbd;
    background-image:
      linear-gradient(rgba(190, 150, 90, 0.22) 1px, transparent 1px),
      linear-gradient(90deg, rgba(190, 150, 90, 0.22) 1px, transparent 1px);
    background-size: 26px 26px;
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #1c1c1c;
  }

  .app {
    width: min(880px, 94vw);
    height: min(820px, 84vh);
    display: flex;
    flex-direction: column;
    background: #fdf6ea;
    border: 3px solid #1c1c1c;
    box-shadow: 12px 12px 0 #1c1c1c;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 18px;
    background: #f7941d;
    border-bottom: 3px solid #1c1c1c;
  }
  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .logo {
    width: 46px;
    height: 46px;
    flex: none;
    display: grid;
    place-items: center;
    background: #fff8ec;
    border: 3px solid #1c1c1c;
  }
  .logo svg { width: 28px; height: 28px; }
  .brand h1 { margin: 0; font-size: 17px; letter-spacing: 0.5px; }
  .status {
    margin-top: 3px;
    font-size: 11px;
    letter-spacing: 0.8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .status .dot { width: 8px; height: 8px; background: #1c1c1c; }

  .btn {
    font: 600 14px/1 "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #fff8ec;
    color: #1c1c1c;
    border: 3px solid #1c1c1c;
    padding: 9px 14px;
    cursor: pointer;
    box-shadow: 4px 4px 0 #1c1c1c;
    transition: transform 0.06s, box-shadow 0.06s;
    white-space: nowrap;
  }
  .btn:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 #1c1c1c; }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 26px 24px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .row { display: flex; gap: 10px; align-items: flex-start; }
  .row.user { justify-content: flex-end; }

  .avatar {
    width: 36px;
    height: 36px;
    flex: none;
    display: grid;
    place-items: center;
    background: #fff8ec;
    border: 3px solid #1c1c1c;
    box-shadow: 3px 3px 0 #1c1c1c;
  }
  .avatar svg { width: 22px; height: 22px; }

  .bubble {
    max-width: 72%;
    padding: 12px 16px;
    border: 3px solid #1c1c1c;
    font-size: 15px;
    line-height: 1.7;
    white-space: pre-wrap;
    word-break: break-word;
    box-shadow: 5px 5px 0 rgba(28, 28, 28, 0.88);
  }
  .row.user .bubble { background: #f0654a; color: #fff; }
  .row.assistant .bubble { background: #fffdf6; }
  .row.assistant .bubble.notice { background: #ffd9cf; font-size: 14px; }

  .bubble .text { white-space: normal; }
  .bubble .text p { margin: 0 0 8px; }
  .bubble .text p:last-child { margin-bottom: 0; }
  .bubble .text :is(h1,h2,h3,h4,h5,h6) { margin: 10px 0 6px; line-height: 1.35; }
  .bubble .text h1 { font-size: 18px; } .bubble .text h2 { font-size: 17px; }
  .bubble .text h3 { font-size: 16px; } .bubble .text h4,h5,h6 { font-size: 15px; }
  .bubble .text ul, .bubble .text ol { margin: 0 0 8px; padding-left: 22px; }
  .bubble .text li { margin: 2px 0; }
  .bubble .text code {
    font-family: Consolas, "SFMono-Regular", Menlo, monospace;
    font-size: 13px;
    background: #f3ead9;
    border: 1px solid #d9c9ae;
    padding: 1px 5px;
  }
  .bubble .text pre {
    margin: 8px 0;
    padding: 10px 12px;
    background: #2b2622;
    color: #f7efe2;
    overflow-x: auto;
    border: 2px solid #1c1c1c;
  }
  .bubble .text pre code { background: transparent; border: 0; padding: 0; color: inherit; }
  .bubble .text blockquote {
    margin: 8px 0;
    padding: 4px 12px;
    border-left: 4px solid #f7941d;
    background: #fbf1df;
    color: #5d5142;
  }
  .bubble .text hr { border: 0; border-top: 2px dashed #c9b797; margin: 10px 0; }
  .bubble .text table { border-collapse: collapse; margin: 8px 0; font-size: 14px; }
  .bubble .text th, .bubble .text td { border: 2px solid #1c1c1c; padding: 4px 10px; text-align: left; }
  .bubble .text th { background: #f7941d; }
  .bubble .text a { color: #b34700; }

  .tools { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .tools:empty { display: none; }
  .badge {
    font-size: 12px;
    line-height: 1.4;
    color: #6b5d4a;
    background: #f3ead9;
    border: 1px dashed #a89277;
    border-radius: 999px;
    padding: 2px 10px;
  }

  .typing { display: inline-flex; gap: 5px; padding: 4px 0; }
  .typing i {
    width: 8px; height: 8px;
    background: #b9a684;
    border: 2px solid #1c1c1c;
    animation: bounce 1s infinite;
  }
  .typing i:nth-child(2) { animation-delay: 0.15s; }
  .typing i:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); }
    30% { transform: translateY(-5px); }
  }

  .text.streaming::after {
    content: "▌";
    margin-left: 2px;
    animation: blink 0.9s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .composer {
    border-top: 3px solid #1c1c1c;
    padding: 16px 18px 12px;
    background: #fdf6ea;
  }
  .inputRow {
    display: flex;
    align-items: flex-end;
    gap: 12px;
    border: 3px solid #1c1c1c;
    background: #fffdf6;
    padding: 10px 10px 10px 14px;
    box-shadow: 5px 5px 0 rgba(28, 28, 28, 0.85);
  }
  textarea {
    flex: 1;
    border: 0;
    outline: 0;
    background: transparent;
    resize: none;
    font: inherit;
    font-size: 15px;
    line-height: 1.5;
    max-height: 120px;
    padding: 6px 0;
    color: #1c1c1c;
  }
  textarea::placeholder { color: #8b7d6b; }
  textarea:disabled { color: #8b7d6b; }

  .send {
    width: 44px;
    height: 44px;
    flex: none;
    display: grid;
    place-items: center;
    background: #f0654a;
    border: 3px solid #1c1c1c;
    box-shadow: 3px 3px 0 #1c1c1c;
    cursor: pointer;
    transition: transform 0.06s, box-shadow 0.06s;
  }
  .send svg { width: 22px; height: 22px; }
  .send:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #1c1c1c; }
  .send:disabled { opacity: 0.55; cursor: not-allowed; }

  .note {
    margin: 10px 0 0;
    text-align: center;
    font-size: 12px;
    color: #7a6a55;
  }

  .cite { color: #b34700; font-weight: 700; cursor: pointer; padding: 0 1px; }
  .cite:hover { background: #ffe9c2; }
  .cite-pop {
    position: fixed; z-index: 50; width: min(360px, 82vw);
    background: #fffdf6; border: 2px solid #1c1c1c;
    box-shadow: 5px 5px 0 rgba(28, 28, 28, 0.22);
    padding: 10px 12px; font-size: 13px; line-height: 1.55;
  }
  .cite-pop .path { font-weight: 700; color: #b34700; margin-bottom: 6px; }
  .cite-pop .q { font-weight: 600; margin-bottom: 4px; }
  .cite-pop .a { white-space: pre-wrap; max-height: 220px; overflow: auto; }
  .feedback {
    display: flex; align-items: center; gap: 6px;
    margin-top: 10px; font-size: 12px; color: #7a6a55;
  }
  .fb-btn {
    border: 2px solid #1c1c1c; background: #fffdf6;
    box-shadow: 2px 2px 0 #1c1c1c; padding: 2px 8px;
    font-size: 14px; line-height: 1.2; cursor: pointer;
  }
  .fb-btn:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 #1c1c1c; }
  .fb-btn.active { background: #ffe9c2; }
  .fb-btn.dim { opacity: 0.35; }
  .fb-btn:disabled { cursor: default; box-shadow: none; }
  .fb-done { display: none; color: #2f7d32; font-weight: 600; }
  .feedback.done .fb-done { display: inline; }

  .action-bar { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .action-btn {
    font: 600 13px/1 "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #fff8ec;
    border: 2px solid #1c1c1c;
    box-shadow: 3px 3px 0 #1c1c1c;
    padding: 8px 14px;
    cursor: pointer;
    transition: transform 0.06s, box-shadow 0.06s;
  }
  .action-btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #1c1c1c; }
  .action-btn:disabled { opacity: 0.45; cursor: default; box-shadow: none; transform: none; }

  .order-cards { display: grid; gap: 8px; margin-top: 10px; }
  .order-card {
    text-align: left;
    background: #fff8ec;
    border: 2px solid #1c1c1c;
    box-shadow: 3px 3px 0 #1c1c1c;
    padding: 10px 12px;
    cursor: pointer;
    font: inherit;
    color: inherit;
    transition: transform 0.06s, box-shadow 0.06s, background 0.06s;
  }
  .order-card:hover { background: #ffe9c2; }
  .order-card:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #1c1c1c; }
  .order-card:disabled { opacity: 0.45; cursor: default; box-shadow: none; transform: none; }
  .order-card .order-head { display: flex; justify-content: space-between; font-weight: 700; }
  .order-card .oid { color: #b34700; }
  .order-card .product { margin-top: 4px; font-size: 14px; }
  .order-card .status-line { margin-top: 2px; font-size: 12px; color: #6b5d4a; }

  .modal-mask {
    position: fixed; inset: 0; z-index: 60;
    background: rgba(28, 28, 28, 0.45);
    display: grid; place-items: center;
  }
  .ticket-form {
    width: min(460px, 90vw);
    background: #fdf6ea;
    border: 3px solid #1c1c1c;
    box-shadow: 8px 8px 0 #1c1c1c;
    padding: 18px 20px 16px;
    font-size: 14px;
  }
  .ticket-form h2 { margin: 0 0 14px; font-size: 17px; }
  .ticket-form label { display: block; margin: 0 0 6px; font-weight: 600; }
  .ticket-form select, .ticket-form textarea, .ticket-form input {
    width: 100%;
    border: 2px solid #1c1c1c;
    background: #fffdf6;
    font: inherit;
    padding: 8px 10px;
    margin-bottom: 14px;
  }
  .ticket-form input[readonly] { background: #f3ead9; color: #6b5d4a; }
  .ticket-form textarea { min-height: 96px; resize: vertical; }
  .ticket-form .err { color: #b3261e; font-size: 12px; min-height: 18px; margin: -6px 0 8px; }
  .ticket-form .row-btns { display: flex; justify-content: flex-end; gap: 10px; }
  .ticket-form .btn { box-shadow: 3px 3px 0 #1c1c1c; padding: 8px 14px; }

  @media (max-width: 560px) {
    body { padding: 0; place-items: stretch; }
    .app { width: 100%; height: 100vh; border: 0; box-shadow: none; }
    .bubble { max-width: 85%; }
  }
</style>
</head>
<body>
<main class="app">
  <header class="topbar">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#1c1c1c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6.5 8.5 5.5 3.5l4.6 2.4"/>
          <path d="M17.5 8.5 18.5 3.5l-4.6 2.4"/>
          <circle cx="12" cy="14" r="7.5"/>
          <circle cx="9.4" cy="13.2" r="0.9" fill="#1c1c1c" stroke="none"/>
          <circle cx="14.6" cy="13.2" r="0.9" fill="#1c1c1c" stroke="none"/>
          <path d="M12 15.2v1.2M12 16.4c.8.8 2 .8 2.8 0M12 16.4c-.8.8-2 .8-2.8 0"/>
        </svg>
      </div>
      <div>
        <h1>小喵 · 智能客服</h1>
        <div class="status"><span class="dot"></span>ONLINE · 喵喵优选</div>
      </div>
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <a class="btn" href="/admin" style="text-decoration:none;color:inherit">后台管理</a>
      <button id="newChat" class="btn" type="button">+ 新对话</button>
    </div>
  </header>

  <section id="messages" class="messages" aria-live="polite"></section>

  <footer class="composer">
    <form id="chatForm" class="inputRow">
      <textarea id="input" rows="1" placeholder="输入消息,和小喵聊聊吧~(回车发送 / Shift+回车换行)"></textarea>
      <button id="send" class="send" type="submit" aria-label="发送">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 11.5 20 4l-4.5 16-4-6.5L4 11.5z"/>
          <path d="M11.5 13.5 20 4"/>
        </svg>
      </button>
    </form>
    <p class="note">小喵是 AI 助手,涉及具体订单会为你转接人工核实</p>
  </footer>
</main>

<script>
  const CAT_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="#1c1c1c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' +
    '<path d="M6.5 8.5 5.5 3.5l4.6 2.4"/><path d="M17.5 8.5 18.5 3.5l-4.6 2.4"/>' +
    '<circle cx="12" cy="14" r="7.5"/>' +
    '<circle cx="9.4" cy="13.2" r="0.9" fill="#1c1c1c" stroke="none"/>' +
    '<circle cx="14.6" cy="13.2" r="0.9" fill="#1c1c1c" stroke="none"/>' +
    '<path d="M12 15.2v1.2M12 16.4c.8.8 2 .8 2.8 0M12 16.4c-.8.8-2 .8-2.8 0"/></svg>';

  const WELCOME = '您好!我是「喵喵优选」的智能客服小喵,很高兴为您服务。请问有什么关于商品、订单、物流或售后的问题需要咨询吗?';

  const messagesEl = document.getElementById('messages');
  const formEl = document.getElementById('chatForm');
  const inputEl = document.getElementById('input');
  const sendEl = document.getElementById('send');
  const newChatEl = document.getElementById('newChat');

  const USER_KEY = 'mewhelp_user_id';
  const CONV_KEY = 'mewhelp_conversation_id';

  function makeId() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return String(Date.now()) + '-' + Math.random().toString(16).slice(2);
  }

  const userId = (() => {
    let id = null;
    try { id = localStorage.getItem(USER_KEY); } catch (e) { /* 隐私模式 */ }
    if (!id) {
      id = makeId();
      try { localStorage.setItem(USER_KEY, id); } catch (e) { /* 隐私模式 */ }
    }
    return id;
  })();

  let conversationId = (() => {
    try {
      const v = localStorage.getItem(CONV_KEY);
      if (v && /^\d+$/.test(v)) return v;
      if (v) localStorage.removeItem(CONV_KEY);   // 垃圾值直接清掉
      return null;
    } catch (e) { return null; }
  })();

  let busy = false;

  function saveConversationId(id) {
    conversationId = id == null ? null : String(id);
    try {
      if (conversationId) localStorage.setItem(CONV_KEY, conversationId);
      else localStorage.removeItem(CONV_KEY);
    } catch (e) { /* 隐私模式 */ }
  }

  function scrollToBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function addUser(text) {
    const row = document.createElement('div');
    row.className = 'row user';
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    row.append(bubble);
    messagesEl.append(row);
    scrollToBottom();
    return row;
  }

  function createAssistantRow() {
    const row = document.createElement('div');
    row.className = 'row assistant';
    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.innerHTML = CAT_SVG;
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    const toolsEl = document.createElement('div');
    toolsEl.className = 'tools';
    const textEl = document.createElement('div');
    textEl.className = 'text';
    bubble.append(toolsEl, textEl);
    textEl.addEventListener('click', e => {
      const el = e.target.closest('.cite');
      if (!el) return;
      const items = bubble._citations || [];
      const item = items.find(c => String(c.n) === el.dataset.n);
      if (item) showCitePop(el, item);
    });
    row.append(avatar, bubble);
    messagesEl.append(row);
    scrollToBottom();
    return { bubble, toolsEl, textEl };
  }

  function addAssistant(text = '') {
    const { bubble, textEl } = createAssistantRow();
    textEl.textContent = text;
    return bubble;
  }

  function addNotice(text) {
    const bubble = addAssistant(text);
    bubble.classList.add('notice');
  }

  function setBusy(value) {
    busy = value;
    inputEl.disabled = value;
    sendEl.disabled = value;
  }

  function parseFrame(frame) {
    let event = 'message';
    const dataLines = [];
    for (const line of frame.split('\n')) {
      if (line.startsWith('event:')) event = line.slice(6).trim();
      else if (line.startsWith('data:')) dataLines.push(line.slice(5).replace(/^ /, ''));
    }
    const data = dataLines.join('\n');
    if (data === '[DONE]') return { done: true };
    let payload = null;
    if (data) {
      try { payload = JSON.parse(data); } catch (e) { payload = null; }
    }
    return { event, payload };
  }

  // ---- 极简 markdown:先整体 HTML 转义再渲染,防注入 ----
  function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function inline(s) {
    s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
    s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
    const links = [];
    s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, (m, text, url) => {
      links.push('<a href="' + url + '" target="_blank" rel="noopener noreferrer">' + text + '</a>');
      return '\u0001' + (links.length - 1) + '\u0001';
    });
    s = s.replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, (m, pre, url) => {
      links.push('<a href="' + url + '" target="_blank" rel="noopener noreferrer">' + url + '</a>');
      return pre + '\u0001' + (links.length - 1) + '\u0001';
    });
    return s.replace(/\u0001(\d+)\u0001/g, (m, i) => links[+i]);
  }

  function renderMarkdown(src) {
    const codes = [];
    src = src.replace(/```[^\n]*\n([\s\S]*?)```/g, (m, code) => {
      codes.push(code.replace(/\n$/, ''));
      return '\u0000' + (codes.length - 1) + '\u0000';
    });
    const lines = escapeHtml(src).split('\n');
    const html = [];
    let para = [];
    let list = null;
    const flushPara = () => {
      if (para.length) { html.push('<p>' + inline(para.join('<br>')) + '</p>'); para = []; }
    };
    const flushList = () => {
      if (list) { html.push('</' + list + '>'); list = null; }
    };
    const closeBlocks = () => { flushPara(); flushList(); };
    let i = 0;
    while (i < lines.length) {
      const t = lines[i].trim();
      if (!t) { closeBlocks(); i++; continue; }
      const codeRef = t.match(/^\u0000(\d+)\u0000$/);
      if (codeRef) {
        closeBlocks();
        html.push('<pre><code>' + escapeHtml(codes[+codeRef[1]]) + '</code></pre>');
        i++; continue;
      }
      let m;
      if ((m = t.match(/^(#{1,6})\s+(.*)$/))) {
        closeBlocks();
        const level = m[1].length;
        html.push('<h' + level + '>' + inline(m[2]) + '</h' + level + '>');
        i++; continue;
      }
      if (/^(-{3,}|\*{3,}|_{3,})$/.test(t.replace(/\s+/g, ''))) {
        closeBlocks(); html.push('<hr>'); i++; continue;
      }
      if ((m = t.match(/^&gt;\s?(.*)$/))) {
        closeBlocks(); html.push('<blockquote>' + inline(m[1]) + '</blockquote>'); i++; continue;
      }
      if (t.startsWith('|') && i + 1 < lines.length && /^\|?[\s:|-]+\|?$/.test(lines[i + 1].trim())) {
        closeBlocks();
        const header = t;
        i += 2;
        const rows = [];
        while (i < lines.length && lines[i].trim().startsWith('|')) { rows.push(lines[i].trim()); i++; }
        const cells = (r) => r.replace(/^\||\|$/g, '').split('|').map((c) => c.trim());
        html.push('<table><thead><tr>' +
          cells(header).map((c) => '<th>' + inline(c) + '</th>').join('') +
          '</tr></thead><tbody>' +
          rows.map((r) => '<tr>' + cells(r).map((c) => '<td>' + inline(c) + '</td>').join('') + '</tr>').join('') +
          '</tbody></table>');
        continue;
      }
      if ((m = t.match(/^[-*]\s+(.*)$/))) {
        flushPara();
        if (list !== 'ul') { flushList(); html.push('<ul>'); list = 'ul'; }
        html.push('<li>' + inline(m[1]) + '</li>');
        i++; continue;
      }
      if ((m = t.match(/^\d+\.\s+(.*)$/))) {
        flushPara();
        if (list !== 'ol') { flushList(); html.push('<ol>'); list = 'ol'; }
        html.push('<li>' + inline(m[1]) + '</li>');
        i++; continue;
      }
      para.push(t);
      i++;
    }
    closeBlocks();
    return html.join('');
  }

  // ---- 引用角标与来源浮层 ----
  function renderWithCitations(src, items) {
    const html = renderMarkdown(src);
    if (!items || !items.length) return html;
    const byN = new Map(items.map(c => [String(c.n), c]));
    return html.replace(/[\[【](\d{1,2})[\]】]/g, (m, n) =>
      byN.has(n) ? '<sup class="cite" data-n="' + n + '">[' + n + ']</sup>' : m);
  }

  let citePop = null;
  function hideCitePop() {
    if (citePop) { citePop.remove(); citePop = null; }
  }

  function showCitePop(anchor, item) {
    hideCitePop();
    const pop = document.createElement('div');
    pop.className = 'cite-pop';
    const path = document.createElement('div');
    path.className = 'path';
    path.textContent = item.section_path || '来源';
    const q = document.createElement('div');
    q.className = 'q';
    q.textContent = '问法:' + (item.question || '');
    const a = document.createElement('div');
    a.className = 'a';
    a.textContent = item.answer || '';
    pop.append(path, q, a);
    document.body.append(pop);
    const rect = anchor.getBoundingClientRect();
    const width = pop.offsetWidth;
    let left = Math.min(rect.left, window.innerWidth - width - 12);
    left = Math.max(12, left);
    let top = rect.bottom + 8;
    if (top + pop.offsetHeight > window.innerHeight - 12) {
      top = Math.max(12, rect.top - pop.offsetHeight - 8);
    }
    pop.style.left = left + 'px';
    pop.style.top = top + 'px';
    citePop = pop;
  }

  document.addEventListener('click', e => {
    if (!citePop) return;
    if (citePop.contains(e.target) || e.target.closest('.cite')) return;
    hideCitePop();
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') hideCitePop(); });

  // ---- 每段回答的满意度反馈(纯前端,一次性锁定) ----
  function addFeedback(bubble) {
    if (bubble.querySelector('.feedback')) return;
    const bar = document.createElement('div');
    bar.className = 'feedback';
    const tip = document.createElement('span');
    tip.textContent = '这段回答对你有帮助吗?';
    const up = document.createElement('button');
    up.type = 'button';
    up.className = 'fb-btn';
    up.textContent = '👍';
    up.title = '有帮助';
    const down = document.createElement('button');
    down.type = 'button';
    down.className = 'fb-btn';
    down.textContent = '👎';
    down.title = '没帮助';
    const done = document.createElement('span');
    done.className = 'fb-done';
    done.textContent = '已反馈,谢谢!';
    const choose = (picked, other) => {
      picked.classList.add('active');
      other.classList.add('dim');
      up.disabled = down.disabled = true;
      bar.classList.add('done');
    };
    up.addEventListener('click', () => choose(up, down));
    down.addEventListener('click', () => choose(down, up));
    bar.append(tip, up, down, done);
    bubble.append(bar);
  }

  function openTicketModal(triggerBtn) {
    const mask = document.createElement('div');
    mask.className = 'modal-mask';
    const form = document.createElement('form');
    form.className = 'ticket-form';
    form.noValidate = true;   // 统一走下面的中文校验提示,不用浏览器原生气泡

    const title = document.createElement('h2');
    title.textContent = '创建工单';

    const typeLabel = document.createElement('label');
    typeLabel.textContent = '反馈类别';
    typeLabel.htmlFor = 'ticketType';
    const select = document.createElement('select');
    select.id = 'ticketType';
    select.required = true;
    const placeholder = document.createElement('option');
    placeholder.value = '';
    placeholder.textContent = '请选择类别';
    placeholder.disabled = true;
    placeholder.selected = true;
    select.append(placeholder);
    for (const t of ['售后', '投诉', '咨询']) {
      const opt = document.createElement('option');
      opt.value = t;
      opt.textContent = t;
      select.append(opt);
    }

    const descLabel = document.createElement('label');
    descLabel.textContent = '反馈描述';
    descLabel.htmlFor = 'ticketDesc';
    const desc = document.createElement('textarea');
    desc.id = 'ticketDesc';
    desc.required = true;
    desc.placeholder = '请描述您遇到的问题';

    const err = document.createElement('div');
    err.className = 'err';

    const btns = document.createElement('div');
    btns.className = 'row-btns';
    const cancel = document.createElement('button');
    cancel.type = 'button';
    cancel.className = 'btn';
    cancel.textContent = '取消';
    const submit = document.createElement('button');
    submit.type = 'submit';
    submit.className = 'btn';
    submit.textContent = '提交工单';
    btns.append(cancel, submit);

    form.append(title, typeLabel, select, descLabel, desc, err, btns);
    mask.append(form);
    document.body.append(mask);
    select.focus();

    const close = () => {
      mask.remove();
      document.removeEventListener('keydown', onKey);
    };
    const onKey = (e) => { if (e.key === 'Escape') close(); };
    document.addEventListener('keydown', onKey);
    cancel.addEventListener('click', close);
    mask.addEventListener('click', (e) => { if (e.target === mask) close(); });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      err.textContent = '';
      if (!select.value || !desc.value.trim()) {
        err.textContent = '请选择反馈类别并填写反馈描述';
        return;
      }
      submit.disabled = true;
      try {
        const resp = await fetch('/api/actions/create-ticket', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            conversation_id: conversationId ? Number(conversationId) : null,
            ticket_type: select.value,
            description: desc.value.trim(),
          }),
        });
        const data = await resp.json().catch(() => ({}));
        if (!resp.ok) throw new Error(data.detail || ('HTTP ' + resp.status));
        close();
        addAssistant('工单已创建:' + (data.ticket_no || ''));
        triggerBtn.disabled = true;
      } catch (ex) {
        err.textContent = '工单创建失败,请稍后重试';
        submit.disabled = false;
      }
    });
  }

  function renderActions(bubble, items) {
    if (!items || !items.length) return;
    const bar = document.createElement('div');
    bar.className = 'action-bar';
    for (const a of items) {
      if (a.type === 'transfer_human') {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'action-btn';
        btn.textContent = '转人工';
        btn.addEventListener('click', () => {
          btn.disabled = true;
          // 本章纯前端模拟,不接真人系统
          addAssistant('已转接人工客服');
          addAssistant('您好,我是客服小猫,请问有什么可以帮您的');
        });
        bar.append(btn);
      } else if (a.type === 'create_ticket') {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'action-btn';
        btn.textContent = '建工单';
        btn.addEventListener('click', () => openTicketModal(btn));
        bar.append(btn);
      } else if (a.type === 'refund_form') {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'action-btn';
        btn.textContent = '提交退款工单';
        btn.addEventListener('click', () => openRefundModal(btn, a.draft || {}));
        bar.append(btn);
      }
    }
    if (bar.children.length) {
      bubble.append(bar);
      scrollToBottom();
    }
  }

  function showTyping(el) {
    el.classList.add('streaming');
    el.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
  }

  // 订单选择器:可点选卡片;点选后禁用整组并续跑暂停的子流程
  function renderOrders(bubble, data) {
    const wrap = document.createElement('div');
    wrap.className = 'order-cards';
    for (const o of data.orders || []) {
      const card = document.createElement('button');
      card.type = 'button';
      card.className = 'order-card';
      const head = document.createElement('div');
      head.className = 'order-head';
      const oid = document.createElement('span');
      oid.className = 'oid';
      oid.textContent = '订单 ' + o.order_id;
      const amount = document.createElement('span');
      amount.className = 'amount';
      amount.textContent = '¥' + (o.amount != null ? o.amount : '-');
      head.append(oid, amount);
      const product = document.createElement('div');
      product.className = 'product';
      product.textContent = o.product || '';
      const status = document.createElement('div');
      status.className = 'status-line';
      status.textContent = o.status || '';
      card.append(head, product, status);
      card.addEventListener('click', () => {
        for (const c of wrap.querySelectorAll('.order-card')) c.disabled = true;
        resumeWithOrder(o.order_id);
      });
      wrap.append(card);
    }
    bubble.append(wrap);
    scrollToBottom();
  }

  // 退款表单:订单号只读 + 原因固定类目下拉
  function openRefundModal(triggerBtn, draft) {
    const mask = document.createElement('div');
    mask.className = 'modal-mask';
    const form = document.createElement('form');
    form.className = 'ticket-form';
    form.noValidate = true;

    const title = document.createElement('h2');
    title.textContent = '提交退款工单';

    const orderLabel = document.createElement('label');
    orderLabel.textContent = '订单号';
    orderLabel.htmlFor = 'refundOrder';
    const order = document.createElement('input');
    order.id = 'refundOrder';
    order.type = 'text';
    order.readOnly = true;
    order.value = (draft && draft.order_id) || '';

    const reasonLabel = document.createElement('label');
    reasonLabel.textContent = '退款原因';
    reasonLabel.htmlFor = 'refundReason';
    const select = document.createElement('select');
    select.id = 'refundReason';
    const placeholder = document.createElement('option');
    placeholder.value = '';
    placeholder.textContent = '请选择退款原因';
    placeholder.disabled = true;
    placeholder.selected = true;
    select.append(placeholder);
    for (const r of ['七天无理由', '质量问题', '发错货', '不想要了', '其他']) {
      const opt = document.createElement('option');
      opt.value = r;
      opt.textContent = r;
      select.append(opt);
    }

    const err = document.createElement('div');
    err.className = 'err';
    const btns = document.createElement('div');
    btns.className = 'row-btns';
    const cancel = document.createElement('button');
    cancel.type = 'button';
    cancel.className = 'btn';
    cancel.textContent = '取消';
    const submit = document.createElement('button');
    submit.type = 'submit';
    submit.className = 'btn';
    submit.textContent = '提交';
    btns.append(cancel, submit);
    form.append(title, orderLabel, order, reasonLabel, select, err, btns);
    mask.append(form);
    document.body.append(mask);
    select.focus();

    const close = () => {
      mask.remove();
      document.removeEventListener('keydown', onKey);
    };
    const onKey = (e) => { if (e.key === 'Escape') close(); };
    document.addEventListener('keydown', onKey);
    cancel.addEventListener('click', close);
    mask.addEventListener('click', (e) => { if (e.target === mask) close(); });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      err.textContent = '';
      if (!order.value || !select.value) {
        err.textContent = '请选择退款原因';
        return;
      }
      if (!conversationId) {
        err.textContent = '会话已失效,请点击「+ 新对话」重试';
        return;
      }
      submit.disabled = true;
      try {
        const resp = await fetch('/api/actions/create-refund', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            conversation_id: Number(conversationId),
            order_id: order.value,
            reason: select.value,
          }),
        });
        const data = await resp.json().catch(() => ({}));
        if (!resp.ok) throw new Error(data.detail || ('HTTP ' + resp.status));
        close();
        addAssistant('退款申请已提交:' + (data.ticket_no || ''));
        triggerBtn.disabled = true;
      } catch (ex) {
        err.textContent = '退款申请提交失败,请稍后重试';
        submit.disabled = false;
      }
    });
  }

  // 统一消费 SSE:chat 与 resume 共用;返回待处理的中断(无则 null)
  async function readSse(res, ui) {
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let interrupt = null;
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      let idx;
      while ((idx = buffer.indexOf('\n\n')) !== -1) {
        const frame = buffer.slice(0, idx);
        buffer = buffer.slice(idx + 2);
        const parsed = parseFrame(frame);
        if (parsed.done) continue;
        if (parsed.event === 'error') {
          ui.upstreamError = (parsed.payload && parsed.payload.message) || '上游模型暂时不可用';
          continue;
        }
        const payload = parsed.payload;
        if (!payload) continue;
        if (payload.event === 'tool' && payload.name) {
          const badge = document.createElement('span');
          badge.className = 'badge';
          badge.textContent = '🔧 调用了 ' + payload.name;
          ui.toolsEl.append(badge);
          continue;
        }
        if (payload.event === 'done' && payload.conversation_id != null) {
          saveConversationId(payload.conversation_id);
          continue;
        }
        if (payload.event === 'interrupt') {
          if (payload.conversation_id != null) saveConversationId(payload.conversation_id);
          interrupt = payload;
          continue;
        }
        if (payload.event === 'citations') {
          ui.citations = Array.isArray(payload.items) ? payload.items : [];
          ui.bubble._citations = ui.citations;
          if (ui.rawText) ui.textEl.innerHTML = renderWithCitations(ui.rawText, ui.citations);
          continue;
        }
        if (payload.event === 'actions') {
          ui.actions = Array.isArray(payload.items) ? payload.items : [];
          continue;
        }
        if (typeof payload.delta === 'string') {
          if (!ui.started) { ui.started = true; ui.textEl.innerHTML = ''; }
          ui.rawText += payload.delta;
          ui.textEl.innerHTML = renderWithCitations(ui.rawText, ui.citations);
          scrollToBottom();
        }
      }
    }
    return interrupt;
  }

  async function resumeWithOrder(orderId) {
    if (!conversationId) {
      addNotice('会话已失效,请点击「+ 新对话」重试');
      return;
    }
    setBusy(true);
    const { bubble, toolsEl, textEl } = createAssistantRow();
    showTyping(textEl);
    const ui = { bubble, toolsEl, textEl, rawText: '', started: false,
                 citations: [], actions: [], upstreamError: null };
    try {
      const res = await fetch('/api/actions/resume', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ conversation_id: Number(conversationId), order_id: orderId }),
      });
      if (!res.ok || !res.body) throw new Error('HTTP ' + res.status);
      const interrupt = await readSse(res, ui);
      if (ui.upstreamError) throw new Error(ui.upstreamError);
      if (interrupt) {
        if (!ui.rawText) {
          ui.started = true;
          textEl.innerHTML = '';
          textEl.textContent = '请选择要退款的订单:';
        }
        textEl.classList.remove('streaming');
        renderOrders(bubble, interrupt);
        return;
      }
      if (!ui.rawText) textEl.textContent = '(小喵这次没有回复内容,请再试一次)';
      else addFeedback(bubble);
      if (ui.actions.length) renderActions(bubble, ui.actions);
      textEl.classList.remove('streaming');
    } catch (err) {
      textEl.classList.remove('streaming');
      if (bubble.parentElement) bubble.parentElement.remove();
      const msg = err && err.message ? err.message : '未知错误';
      addNotice('续跑失败:' + msg + '。请再试一次。');
    } finally {
      setBusy(false);
      inputEl.focus();
    }
  }

  async function sendMessage(text) {
    text = text.trim();
    if (!text || busy) return;
    setBusy(true);
    let retried = false;
    try {
      for (;;) {
        const userRow = addUser(text);
        const { bubble, toolsEl, textEl } = createAssistantRow();
        showTyping(textEl);
        const ui = { bubble, toolsEl, textEl, rawText: '', started: false,
                     citations: [], actions: [], upstreamError: null };

        try {
          const res = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ user_id: userId, message: text, conversation_id: conversationId }),
          });
          if (!res.ok || !res.body) throw new Error('HTTP ' + res.status);

          const interrupt = await readSse(res, ui);
          if (ui.upstreamError) throw new Error(ui.upstreamError);

          if (interrupt) {
            // 图暂停在订单选择器:渲染可点选卡片,点选后走 /api/actions/resume 续流
            if (!ui.rawText) {
              ui.started = true;
              textEl.innerHTML = '';
              textEl.textContent = '请选择要退款的订单:';
            }
            textEl.classList.remove('streaming');
            renderOrders(bubble, interrupt);
            return;
          }

          if (!ui.rawText) textEl.textContent = '(小喵这次没有回复内容,请再试一次)';
          else addFeedback(bubble);
          if (ui.actions.length) renderActions(bubble, ui.actions);
          textEl.classList.remove('streaming');
          return;
        } catch (err) {
          textEl.classList.remove('streaming');
          const msg = err && err.message ? err.message : '未知错误';
          if (bubble.parentElement) bubble.parentElement.remove();
          // 只对「会话不存在」自愈;422 可能是别的校验失败(如空消息),重试无益
          const staleConversation = conversationId && msg === '会话不存在';
          if (!retried && staleConversation) {
            retried = true;
            saveConversationId(null);
            if (userRow.parentElement) userRow.remove();
            continue;
          }
          addNotice('小喵暂时联系不上:' + msg + '。请稍后重试。');
          return;
        }
      }
    } finally {
      setBusy(false);
      inputEl.focus();
    }
  }

  function autoGrow() {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
  }

  formEl.addEventListener('submit', (e) => {
    e.preventDefault();
    const text = inputEl.value;
    inputEl.value = '';
    autoGrow();
    sendMessage(text);
  });

  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      formEl.requestSubmit();
    }
  });

  inputEl.addEventListener('input', autoGrow);

  newChatEl.addEventListener('click', () => {
    if (busy) return;
    saveConversationId(null);
    messagesEl.innerHTML = '';
    addAssistant(WELCOME);
    inputEl.focus();
  });

  addAssistant(WELCOME);
  inputEl.focus();
</script>
