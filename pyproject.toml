[project]
name = "mewhelp"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "arize-phoenix>=20.6.0",
    "asyncmy>=0.2.9",
    "cryptography>=50.0.2",
    "fastapi>=0.162.5",
    "jieba>=0.42.1",
    "jsonschema>=4.26.0",
    "langchain>=1.5.0",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-openai>=1.7.4",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.21",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "mcp>=1.30.0",
    "milvus-lite>=3.2.2",
    "openai>=3.50.0",
    "openinference-instrumentation-langchain>=0.1.86",
    "pydantic-settings>=2.16.2",
    "pymilvus>=3.0.3",
    "sqlalchemy[asyncio]>=2.0.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]
# ch10 训练/导出重依赖,主 dependencies 零污染:uv run --group ml ...
ml = [
    "torch>=2.6",
    "transformers>=5.0",
    "accelerate>=1.0",
    "scikit-learn>=1.5",
    "onnx>=1.17",
    "onnxruntime>=1.20",
    "onnxscript>=0.3",          # torch dynamo 版 ONNX 导出器的必需依赖
    "tokenizers>=0.20",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# 测试辅助模块(tests/fake_model.py)以顶层名导入
pythonpath = ["tests"]
# DB 引擎按 session 作用域建在同一个事件循环里;若 fixture 与测试分属不同
# loop,连接池里的连接跨 loop 使用会报 proactor 'NoneType' has no attribute 'send'
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

# ch10:Windows 上 PyPI 的 torch 是 CPU 构建;cu128 源只对 ml 组生效
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128", group = "ml" }
